name: Isolated frontend UX verification

on:
  push:
    branches: [verify/frontend-critical-ux]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Archive exact source snapshot
        run: git archive --format=tar.gz -o frontend-source.tar.gz HEAD
      - name: Install locked dependencies
        run: npm ci
      - name: Capture local verification dependencies
        run: tar -czf frontend-test-dependencies.tar.gz node_modules/react node_modules/react-dom node_modules/scheduler node_modules/typescript node_modules/tailwindcss node_modules/@tailwindcss node_modules/@types/react node_modules/@types/react-dom
      - name: Baseline type check
        id: types
        continue-on-error: true
        run: npx tsc --noEmit
      - name: Baseline production build
        id: build
        continue-on-error: true
        run: npm run build
      - name: Upload verification files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification-environment
          path: |
            frontend-source.tar.gz
            frontend-test-dependencies.tar.gz
          retention-days: 3
      - name: Record baseline results
        if: always()
        run: |
          echo 'Type check: ${{ steps.types.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Production build: ${{ steps.build.outcome }}' >> "$GITHUB_STEP_SUMMARY"

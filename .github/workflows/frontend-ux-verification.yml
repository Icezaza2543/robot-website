name: Isolated frontend UX verification

on:
  push:
    branches: [verify/frontend-critical-ux]
    paths: ['.frontend-verification/RUN']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: frontend-verification-fixture-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and apply exact tested patch
        run: |
          base64 --decode .frontend-verification/frontend.patch.gz.b64 | gzip -d > /tmp/frontend.patch
          echo 'b6d20cab73637359ee141d4af5ebd9ca0f99738d7014a1116568eb8347087428  /tmp/frontend.patch' | sha256sum --check
          git apply --check /tmp/frontend.patch
          git apply /tmp/frontend.patch
          git diff --check
          git diff --stat
      - name: Install locked application dependencies
        run: npm ci
      - name: Install browser runner outside the application dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/frontend-playwright" --no-package-lock @playwright/test
          mkdir -p node_modules/@playwright
          ln -s "$RUNNER_TEMP/frontend-playwright/node_modules/@playwright/test" node_modules/@playwright/test
          "$RUNNER_TEMP/frontend-playwright/node_modules/.bin/playwright" install --with-deps chromium
          npm ls next react react-dom typescript --depth=0
          git diff --exit-code -- package.json package-lock.json
      - name: Type check with locked application dependencies
        run: npx --no-install tsc --noEmit
      - name: Production build with locked application dependencies
        run: npm run build
      - name: Chromium full-app regression tests
        run: '"$RUNNER_TEMP/frontend-playwright/node_modules/.bin/playwright" test --config=.frontend-verification/playwright.config.ts'
      - name: Archive source checksums
        if: always()
        run: |
          git diff --name-only -z | xargs -0 sha256sum > frontend-source-checksums.txt
          git diff > frontend-verified.patch
          npm ls next react react-dom typescript --depth=0 > frontend-dependency-versions.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-critical-ux-results
          path: |
            test-results/
            playwright-report/
            frontend-source-checksums.txt
            frontend-verified.patch
            frontend-dependency-versions.txt
          retention-days: 7
